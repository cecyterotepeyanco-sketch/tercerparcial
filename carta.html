<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Navidad y Cruz Azul Campeón - Para Luis Manuel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #183a2c 0%, #091812 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: #fff;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Nieve animada */
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Controles superiores */
    .controls {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      color: #f8e7b9;
      border: 1px solid rgba(248, 231, 185, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s;
    }

    .btn:hover {
      background: rgba(248, 231, 185, 0.25);
      transform: translateY(-1px);
    }

    /* Contenedor de la tarjeta */
    .card-container {
      position: relative;
      z-index: 10;
      width: 340px;
      height: 500px;
      perspective: 1500px;
    }

    /* Vistas (Portada vs Interior Cruz Azul) */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
      text-align: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    /* Portada Navideña */
    .card-front {
      background: linear-gradient(160deg, #9e2a2b 0%, #641216 100%);
      border: 2px solid #e6c25b;
      cursor: pointer;
      z-index: 2;
      opacity: 1;
      transform: scale(1);
    }

    .card-container.is-open .card-front {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    .front-tag {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(230, 194, 91, 0.5);
      color: #fce9a8;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      font-family: system-ui, sans-serif;
    }

    .front-title {
      font-size: 2.15rem;
      line-height: 1.15;
      color: #fce9a8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    .tree-svg {
      width: 165px;
      height: 185px;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.4));
    }

    .ornament {
      animation: blink 1.8s infinite alternate;
    }

    .ornament:nth-child(even) {
      animation-delay: 0.9s;
    }

    @keyframes blink {
      0% { opacity: 0.55; }
      100% { opacity: 1; }
    }

    .tap-hint {
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      color: #f8e7b9;
      opacity: 0.9;
    }

    /* Interior: Cruz Azul Campeón */
    .card-inside {
      background: linear-gradient(155deg, #003876 0%, #001c3d 100%);
      border: 2px solid #00bfff;
      color: #ffffff;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.03);
    }

    .card-container.is-open .card-inside {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .ca-header {
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7dd3fc;
      font-weight: 700;
    }

    .ca-title {
      font-size: 1.45rem;
      color: #ffffff;
      margin-top: 4px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0, 191, 255, 0.5);
    }

    .ca-message {
      font-size: 0.96rem;
      line-height: 1.45;
      color: #e0f2fe;
      font-style: italic;
    }

    .video-box {
      width: 100%;
      height: 200px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #00bfff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ca-sender {
      font-size: 1rem;
      color: #7dd3fc;
      font-weight: bold;
    }

    .close-hint {
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      color: #bae6fd;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(125, 211, 252, 0.4);
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .close-hint:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    @media (max-width: 400px) {
      .card-container {
        width: 310px;
        height: 480px;
      }
    }
  </style>
</head>
<body>

  <canvas id="snow-canvas"></canvas>

  <div class="controls">
    <button class="btn" id="toggle-card-btn" type="button">Abrir tarjeta</button>
    <button class="btn" id="music-btn" type="button">Música: Off</button>
  </div>

  <div class="card-container" id="card-container">
    <!-- Portada Navideña -->
    <div class="card-face card-front" id="card-front" role="button" tabindex="0" aria-label="Abrir tarjeta navideña para Luis Manuel">
      <div class="front-tag">Para: Luis Manuel</div>
      <h1 class="front-title">¡Feliz<br>Navidad!</h1>

      <svg class="tree-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
        <polygon points="100,10 106,27 124,27 110,38 115,55 100,45 85,55 90,38 76,27 94,27" fill="#ffd166" />
        <rect x="86" y="172" width="28" height="32" rx="4" fill="#5c3a21" />
        <polygon points="100,36 45,105 155,105" fill="#1b5e20" />
        <polygon points="100,72 34,145 166,145" fill="#237429" />
        <polygon points="100,108 22,180 178,180" fill="#2e8b36" />
        <circle class="ornament" cx="85" cy="88" r="6" fill="#ff595e" />
        <circle class="ornament" cx="118" cy="94" r="6" fill="#ffd166" />
        <circle class="ornament" cx="72" cy="128" r="7" fill="#ffd166" />
        <circle class="ornament" cx="104" cy="122" r="6" fill="#4cc9f0" />
        <circle class="ornament" cx="132" cy="134" r="7" fill="#ff595e" />
        <circle class="ornament" cx="62" cy="164" r="7" fill="#4cc9f0" />
        <circle class="ornament" cx="98" cy="160" r="8" fill="#ff595e" />
        <circle class="ornament" cx="138" cy="166" r="7" fill="#ffd166" />
      </svg>

      <div class="tap-hint">Toca la tarjeta para abrir</div>
    </div>

    <!-- Interior: Solo felicitación Cruz Azul + Video CA.mp4 -->
    <div class="card-face card-inside" id="card-inside">
      <div>
        <div class="ca-header">¡Regalo de Navidad Celeste! ⚽</div>
        <div class="ca-title">¡Cruz Azul Campeón!</div>
      </div>

      <p class="ca-message">
        ¡Muchas felicidades, Luis Manuel, porque Cruz Azul ganó la Liga MX! Que esta alegría celeste acompañe toda tu Navidad.
      </p>

      <div class="video-box">
        <video id="ca-video" src="CA.mp4" controls loop playsinline>
          Tu navegador no soporta la reproducción de video.
        </video>
      </div>

      <div class="ca-sender">Con cariño, Adrian</div>

      <button class="close-hint" id="close-card-btn" type="button">Volver a la portada</button>
    </div>
  </div>

  <script>
    (function () {
      var container = document.getElementById("card-container");
      var cardFront = document.getElementById("card-front");
      var toggleBtn = document.getElementById("toggle-card-btn");
      var closeBtn = document.getElementById("close-card-btn");
      var musicBtn = document.getElementById("music-btn");
      var video = document.getElementById("ca-video");
      var isOpen = false;

      function setCardState(open) {
        isOpen = open;
        if (isOpen) {
          container.classList.add("is-open");
          toggleBtn.textContent = "Cerrar tarjeta";
          if (video && typeof video.play === "function") {
            video.play().catch(function () {});
          }
        } else {
          container.classList.remove("is-open");
          toggleBtn.textContent = "Abrir tarjeta";
          if (video && typeof video.pause === "function") {
            video.pause();
          }
        }
      }

      cardFront.addEventListener("click", function () {
        setCardState(true);
      });

      cardFront.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          setCardState(true);
        }
      });

      toggleBtn.addEventListener("click", function () {
        setCardState(!isOpen);
      });

      closeBtn.addEventListener("click", function () {
        setCardState(false);
      });

      /* Nieve en Canvas */
      var canvas = document.getElementById("snow-canvas");
      var ctx = canvas.getContext("2d");
      var width = 0;
      var height = 0;
      var flakes = [];

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      for (var i = 0; i < 90; i++) {
        flakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 3 + 1.2,
          speedY: Math.random() * 1.2 + 0.5,
          speedX: (Math.random() - 0.5) * 0.6
        });
      }

      function animateSnow() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        ctx.beginPath();
        for (var i = 0; i < flakes.length; i++) {
          var f = flakes[i];
          f.y += f.speedY;
          f.x += f.speedX;
          if (f.y > height) {
            f.y = -5;
            f.x = Math.random() * width;
          }
          if (f.x > width) f.x = 0;
          if (f.x < 0) f.x = width;
          ctx.moveTo(f.x, f.y);
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        }
        ctx.fill();
        requestAnimationFrame(animateSnow);
      }
      animateSnow();

      /* Música navideña con Web Audio API */
      var audioCtx = null;
      var isPlaying = false;
      var musicTimer = null;
      var noteIndex = 0;

      var melody = [
        [329.63, 250], [329.63, 250], [329.63, 500],
        [329.63, 250], [329.63, 250], [329.63, 500],
        [329.63, 250], [392.00, 250], [261.63, 350], [293.66, 150], [329.63, 700],
        [349.23, 250], [349.23, 250], [349.23, 350], [349.23, 150],
        [349.23, 250], [329.63, 250], [329.63, 250], [329.63, 250],
        [329.63, 250], [293.66, 250], [293.66, 250], [329.63, 250], [293.66, 500], [392.00, 500]
      ];

      function playNextNote() {
        if (!isPlaying) return;
        var note = melody[noteIndex];
        var freq = note[0];
        var dur = note[1];

        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur / 1000);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur / 1000);

        noteIndex = (noteIndex + 1) % melody.length;
        musicTimer = setTimeout(playNextNote, dur + 40);
      }

      musicBtn.addEventListener("click", function () {
        if (!isPlaying) {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioCtx) audioCtx = new AudioContextClass();
          if (audioCtx.state === "suspended") audioCtx.resume();
          isPlaying = true;
          musicBtn.textContent = "Música: On";
          playNextNote();
        } else {
          isPlaying = false;
          clearTimeout(musicTimer);
          musicBtn.textContent = "Música: Off";
        }
      });
    })();
  </script>
</body>
</html>
